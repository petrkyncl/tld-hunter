# tools.mationx.com — hub for internal tools; TLD Hunter lives under /tld.
#
# Install (not done automatically — going live is a deliberate step):
#   sudo cp deploy/nginx-tools.mationx.com.conf /etc/nginx/sites-available/tools.mationx.com
#   sudo ln -s /etc/nginx/sites-available/tools.mationx.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tools.mationx.com
#
# Requires a DNS record for tools.mationx.com pointing at the VPS first.

server {
    listen 80;
    server_name tools.mationx.com;

    location = / {
        return 302 /tld;
    }

    location /tld {
        proxy_pass http://127.0.0.1:4011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # A scan streams NDJSON for minutes: buffering or compressing it would
        # hold every row back until the very end.
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
